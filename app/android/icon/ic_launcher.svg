<?xml version="1.0" encoding="UTF-8"?>
<!-- pi-handset's mark: pi, set in the machine's voice.

     The glyph is DejaVu Sans Mono Bold's U+03C0, outlined to a path so nothing
     depends on a font being installed at build time, and laid out on the 108dp
     adaptive-icon canvas: the art is 43.2dp wide, centred, which keeps it inside
     the 66dp circle the launcher guarantees and still fills ~60% of the 72dp a
     launcher actually shows. Leaning on the keyboard face is the point - pi's
     terminal voice is monospace, and so is this app's.

     This file is the single source of truth for every launcher asset: run
     android/icon/generate_launcher_icons.py after editing it. -->
